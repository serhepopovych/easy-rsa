
## User CAs

$HTTP["url"] =~ url_prefix_ca_regex + "/ca" + url_suffix_regex {
  # CAs certificate and CRL files
  # /~<user>/.+CA/ca

  # dirlisting
  dir-listing.activate = "enable"
  index-file.names = ()
}
else $HTTP["url"] =~ url_p12_regex {
  # Make PKCS#12 accessible only from allowed remote IPs
  # /~<user>/.+CA/.+/.+\.p12

  $HTTP["remoteip"] =~ ".+" {
    url.rewrite-once = (
      "^/(~[^/]+(/[^/]*)*)/([^/]+\.p12)$" => "/$1/%0/$3",
      "" => "/"
    )
  }

  auth.backend.htdigest.userfile = auth_userfile

  auth.require = ( "" =>
                   (
                     "method"  => "digest",
                     "realm"   => "Restricted area",
                     "require" => "user=letsencrypt"
                   )
                 )

  # Follow symlinks
  server.follow-symlink = "enable"
}
else $HTTP["url"] =~ url_prefix_secdl_regex + url_suffix_regex {
  # /~<user>/sec/<mac>/<timestamp>/.+CA/.+/.+

  # secdownload
  setenv.set-request-header += ( # 1.4.46+
    "X-secdl-algorithm"     => var.secdl_algorithm,
    "X-secdl-path-segments" => var.secdl_path_segments,
    "X-secdl-secret"        => var.secdl_secret,
    "X-secdl-timeout"       => var.secdl_timeout,
    "X-secdl-document-root" => var.secdl_document_root,
    "X-secdl-uri-prefix"    => var.secdl_uri_prefix
  )

  magnet.attract-physical-path-to = ( "/usr/local/lib/lighttpd/mod_secdownload.lua" )

  # dirlisting
  dir-listing.activate = "enable"
  index-file.names = ()
}
else {
  # All certificates issued and published by user CAs
  # /~<user>

  auth.backend.htdigest.userfile = auth_userfile

  auth.require = ( "" =>
                   (
                     "method"  => "digest",
                     "realm"   => "Published certificates by user CAs",
                     "require" => "user=" + auth_username
                   )
                 )

  # dirlisting
  dir-listing.activate = "enable"
  index-file.names = ()
}
